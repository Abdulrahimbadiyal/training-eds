<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product detail preview</title>
  <link rel="stylesheet" href="/styles/fonts.css">
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="stylesheet" href="/blocks/product-detail/product-detail.css">
  <style>
    body { display: block; }
    main > .section > div { max-width: 1200px; margin: auto; padding: 24px; }
  </style>
</head>
<body class="appear">
  <header></header>
  <main>
    <div class="section">
      <div class="product-detail-wrapper">
        <div class="product-detail block" data-block-name="product-detail" data-block-status="loaded"></div>
      </div>
    </div>
  </main>
  <footer></footer>

  <script type="module">
    import decorate from '/blocks/product-detail/product-detail.js';
    import { loadHeader, loadFooter } from '/scripts/aem.js';

    // render the site header + footer like a real EDS page
    loadHeader(document.querySelector('header'));
    loadFooter(document.querySelector('footer'));

    // mirrors the authored key/value rows
    const rows = [
      ['base-url', 'https://dummyjson.com'],
      ['product-path', '/products'],
      ['back-url', '/tools/preview/products.html'],
      ['back-label', 'Back to products'],
      ['default-id', '1'],
    ];

    const block = document.querySelector('.product-detail');
    rows.forEach(([key, value]) => {
      const row = document.createElement('div');
      const k = document.createElement('div');
      k.textContent = key;
      const v = document.createElement('div');
      v.textContent = value;
      row.append(k, v);
      block.append(row);
    });

    decorate(block);
  </script>
</body>
</html>
