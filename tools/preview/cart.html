<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart preview</title>
  <link rel="stylesheet" href="/styles/fonts.css">
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="stylesheet" href="/blocks/cart/cart.css">
  <style>
    body { display: block; }
    main > .section > div { max-width: 1200px; margin: auto; padding: 24px; }
  </style>
</head>
<body class="appear">
  <header></header>
  <main>
    <div class="section">
      <div class="cart-wrapper">
        <div class="cart block" data-block-name="cart" data-block-status="loaded"></div>
      </div>
    </div>
  </main>
  <footer></footer>

  <script type="module">
    import decorate from '/blocks/cart/cart.js';
    import { loadHeader, loadFooter } from '/scripts/aem.js';

    loadHeader(document.querySelector('header'));
    loadFooter(document.querySelector('footer'));

    // mirrors the authored key/value rows
    const rows = [
      ['heading', 'Your Cart'],
      ['products-url', '/products'],
    ];
    const block = document.querySelector('.cart');
    rows.forEach(([key, value]) => {
      const row = document.createElement('div');
      const k = document.createElement('div');
      k.textContent = key;
      const v = document.createElement('div');
      v.textContent = value;
      row.append(k, v);
      block.append(row);
    });

    decorate(block);
  </script>
</body>
</html>
